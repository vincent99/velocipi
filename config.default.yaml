addr: "0.0.0.0:8080"

# Free-form aircraft identifier (tail number). Shown in the UI and recorded in
# liveatc session manifests.
tailNumber: "N12345"
tailType: "Velocity V-Twin"

pingInterval: "1s"

# Physical hardware wiring: bus devices, the shared reset pin, and each
# attached peripheral (sensors, expander, OLED, knob, LCD, etc.).
hardware:
  spiDevice: "/dev/spidev0.0"
  i2cDevice: "/dev/i2c-1"
  resetPin: 5

  airSensor:
    address: 0x77
    interval: "1s"

  expander:
    address: 0x27
    interval: "2ms"
    bits:
      knobInnerA: 0
      knobOuterA: 1
      knobInnerB: 2
      knobOuterB: 3
      knobCenter: 4
      ledR: 5
      ledW: 6
      ledB: 7
      ledY: 8
      joyCenter: 9
      joyUp: 10
      joyLeft: 11
      joyDown: 12
      joyRight: 13
      joyKnobA: 14
      joyKnobB: 15

  lightSensor:
    address: 0x10
    interval: "1s"

  oled:
    driver: "ssd1327"
    statusPin: 4
    flip: false
    gpioChip: "gpiochip0"
    spiSpeed: "2.40MHz"

  screen:
    fps: 30
    splashDuration: "2s"
    splashImage: "ui/public/img/logo.png"

  axis:
    device: "/dev/ttyAMA0"

  lcd:
    minBrightness: 1
    maxBrightness: 0

  knob:
    device: "/dev/tty.usbserial0"
    minBrightness: 1
    maxBrightness: 100

  thermal:
    device: "/dev/ttyAMA4"

storage:
  # Relative storage paths are interpreted relative to the directory this config
  # file lives in (the intercom-stt process resolves them this way), so the data
  # tree travels with the config regardless of where the process is launched.
  dvr: "data/recordings"
  music: "data/music"
  backup: "data/backup"
  snaps: "data/snaps"
  liveatc: "data/liveatc"

dvr:
  segmentDuration: 600
  thumbnailHeight: 240
  ffmpegLog: false
  record: true
  minFreeDisk: 0
  diskSpacePoll: "1m"
  cameras: []

airCon:
  # Transport is the knob's serial link (see the `hardware.knob:` section) -- no
  # device/pairing config lives here anymore, the knob owns that.
  historyMinutes: 30

tires:
  nose:
  left:
  right:

brightness:
  delay: "2s"
  speed: "2s"
  minLux: 4
  maxLux: 100

music:
  acoustidKey: ""
  acoustidMinScore: 0.8
  albumRequiredPercent: 50
  audioDevice: "auto"
  maxBitrate: 0
  minDbVersion: 1
  playedRequiredPercent: 50
  transcodeFormat: aac
  volume: 100

ui:
  headerColor: "#3b82f6"
  adminHeaderColor: "#dc2626"
  panel:
    width: 256
    height: 64
    controlBackground: "#000000"
    controlBorder: "#444444"
    controlText: "#ffffff"
    selectedBackground: "#222222"
    selectedBorder: "#888888"
    selectedText: "#ffffff"
    activeBackground: "#ffffff"
    activeBorder: "#888888"
    activeText: "#000000"
    homeTimezone: "America/Phoenix"
    timeFormat: "hh:mm:ssa"
  navMenu:
    hideDelay: 2000
    cellWidth: 64
    longPressMs: 1000
  keyMap:
    up: ArrowUp
    down: ArrowDown
    left: ArrowLeft
    right: ArrowRight
    enter: Enter
    joyLeft: ","
    joyRight: .
    innerLeft: ;
    innerRight: "'"
    outerLeft: "["
    outerRight: "]"

# liveatc: cockpit-intercom capture / VAD / whisper transcription, run by the
# standalone intercom-stt process. It reads this same file; the aircraft/tail
# identifier comes from the top-level `tailNumber` above.
liveatc:
  # Address the internal transcript API / websocket server listens on.
  addr: "0.0.0.0:8090"

  # slog level: debug | info | warn | error
  logLevel: "info"

  # Built Vue SPA directory served at "/" (relative to the working dir). Build
  # it with `make ui` in liveatc/. Empty disables UI serving (API only).
  uiDir: "ui/dist"

  audio:
    # ALSA capture device. Override via config.yaml or the AUDIO_DEVICE env var.
    audioDevice: "hw:1,0"
    # Whisper's native input rate. Capturing at 16k avoids a resample step.
    sampleRate: 16000
    # arecord binary (used for live hardware capture).
    arecordBin: "arecord"
    # ffmpeg binary (used for --stream / --file test sources).
    ffmpegBin: "ffmpeg"
    # Capture channels: 1 = mono; 2 = stereo. With 2, liveatc detects per frame
    # whether the two channels are identical (radios joined -> one "mono"
    # transmission) or independent (split -> the left and right radios are
    # transcribed separately), and tags each transmission with its channel.
    channels: 1
    monoLabel: "mono" # label when joined (can't tell which radio)
    leftLabel: "com1" # left channel when split
    rightLabel: "com2" # right channel when split
    # L/R difference-energy ratio above which a stereo frame is "split"
    # (identical channels ~0, independent ~1). 0 = detector default (0.15).
    splitThreshold: 0.15

  vad:
    # Which frame scorer to use: "silero" (python sidecar, preferred) or
    # "energy" (pure-Go RMS gate, no dependencies -- handy for dev/testing).
    # If "silero" is selected but the sidecar fails to start, we log a
    # warning and fall back to "energy" so the pipeline still runs.
    engine: "silero"
    # Path to the python interpreter and sidecar script for the silero engine.
    # A relative path here is resolved against the process working directory
    # (where intercom-stt is launched from); a bare command like "python3" is
    # left alone so it resolves via $PATH.
    sileroPython: "python3"
    sileroScript: "sidecar/silero_vad.py"
    # Path to the Silero ONNX model file. When set, it is passed to the sidecar
    # as the SILERO_ONNX env var, selecting the lighter onnxruntime backend
    # (numpy + onnxruntime) instead of torch.hub. Empty = use the torch.hub
    # backend (which downloads/caches the model on first run). A relative path is
    # resolved under storage.liveatc.
    sileroOnnx: ""
    # Speech-probability threshold [0..1] above which a frame counts as speech.
    threshold: 0.5

    min_speech_ms: 300 # filters PTT blips / clicks
    min_silence_ms: 800 # trailing silence that ends a transmission (carrier gate OFF)
    max_segment_ms: 60000 # hard cap; split + flush if exceeded
    pre_roll_ms: 200 # audio kept before the VAD trigger (clipped starts)

    # Carrier gate: separate transmissions by the radio carrier (mic un-key /
    # squelch), not by pauses in speech -- so a tower instruction and its pilot
    # read-back become separate segments even when they're back-to-back, while a
    # mid-sentence pause never splits one transmission. carrier_floor is the RMS
    # (0..32767) above which the channel is "keyed"; the transmission ends once
    # the carrier stays below it for carrier_hangover_ms. Silero still confirms a
    # keyed run holds speech (drops squelch-tail noise bursts).
    # Set carrier_floor: 0 to disable and fall back to min_silence_ms (for feeds
    # that don't squelch to near-silence between transmissions).
    carrier_floor: 250
    carrier_hangover_ms: 100

  whisper:
    binary: "/usr/local/bin/whisper-cli"
    # GGML model file. A relative path is resolved under storage.liveatc (e.g.
    # "models/ggml-base.en.bin" -> <storage.liveatc>/models/ggml-base.en.bin).
    model: "/opt/models/ggml-base.en.bin"
    # Optional dir holding a fine-tuned ATC model; if a *.bin exists here and
    # `atcModel` names it, it is used in place of `model`. A relative path is
    # resolved under storage.liveatc.
    modelDir: "/opt/models"
    atcModel: "" # filename within modelDir, e.g. "ggml-atc.bin"; "" = disabled
    language: "en"
    threads: 4 # RPi 5 has 4 performance cores
    workers: 2 # STT worker goroutines
    # Initial prompt passed to whisper (--prompt). IMPORTANT: whisper treats this
    # as *preceding transcript text* it will try to continue -- it is priming, NOT
    # an instruction field. Give it a short block of EXAMPLE transmissions in the
    # exact style/formatting you want (callsigns, digits with commas, FL levels,
    # runway letter suffixes, waypoint word + phonetics, [blocked]); do NOT write
    # rules/bullets/meta-instructions -- those confuse the decoder (especially the
    # small-decoder large-v3-turbo) and can make it emit nothing.
    # LIMIT: ~224 tokens (~150 words) for ALL Whisper sizes -- the decoder context
    # is 448 for every model (tiny .. large-v3-turbo) and only half is used for the
    # prompt; GPU/hardware doesn't change this. Over-long prompts are truncated to
    # their last ~224 tokens (not an error). ${tailNumber}/${tailType} are
    # substituted from the top-level config.
    prompt: >-
      Velocity 1ME, 4 miles from POTER, maintain 3,000 until established, cleared GPS runway 4R approach, contact Chandler Tower 133.1.
      Cleared GPS 4R approach, over to tower, good day, 1ME.
      FedEx 1234 heavy, turn left heading 210, descend and maintain FL270.
      Cleared for takeoff runway 30L, squawk 2734, contact departure 123.475.
      Cessna 747SC, cleared direct POTER, Papa Oscar Tango Echo Romeo, climb and maintain 13,000.
      ${tailType} ${tailNumber}, radar contact, resume own navigation.
      [blocked]

  # TX vs RX detection.
  #  - pttPin: GPIO line (name or offset) wired to the PTT line. When set, a
  #    high level during a transmission marks it "tx" definitively (else "rx").
  #    Empty = GPIO monitor disabled.
  #  - pttChip: gpiochip device for the PTT line.
  #  - pttActiveLow: true if the PTT line is asserted low.
  #  - txRmsThreshold: audio-level heuristic used only when pttPin is empty.
  #    Mean segment RMS (0..32767) above this marks "tx"; otherwise "unknown".
  #    0 disables the heuristic (everything is "unknown" without GPIO).
  pttPin: ""
  pttChip: "gpiochip0"
  pttActiveLow: false
  txRmsThreshold: 0
